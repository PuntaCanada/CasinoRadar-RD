name: Radar
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '24 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/*.test.mjs
      - run: node scripts/build.mjs && git diff --exit-code
  import:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/import.mjs && node scripts/build.mjs && node --test scripts/*.test.mjs
      - name: Publish source snapshot
        run: |
          git add data/snapshot.json index.html en/index.html de/index.html fr/index.html it/index.html
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Update official source snapshot'
          git push origin HEAD:main
